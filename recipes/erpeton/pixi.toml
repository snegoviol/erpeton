# ==================================================================================================
# recipes/erpeton/pixi.toml
# ==================================================================================================

[package]
name = "erpeton"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }

[package.host-dependencies]
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
pybind11 = ">=3.1.0,<4"
python = ">=3.15.2,<3.16"
setuptools = ">=84.2.1,<85"

# ==================================================================================================
